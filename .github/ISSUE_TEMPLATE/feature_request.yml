name: Feature request
description: Something this client should do and does not
labels: ['enhancement']
body:
  - type: textarea
    id: what
    attributes:
      label: What you want to do
      description: The Knex code you would like to write, and what it should do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs here
      description: >
        Whether it is something Knex's own `pg` client already does, something PostgreJS can do
        that Knex has no way to ask for, or something new.
